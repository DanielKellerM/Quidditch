name        = "gemm_square_32"
mlir        = "runtime/samples/gemm_square/gemm_square_32.mlir"
entry       = "gemm64"
module      = "gemm_mod"
op          = "matmul_transpose_b"
dtype       = "f64"
transpose_b = true
shape       = { M = 32, N = 32, K = 32 }
bindings    = ["A", "B", "C"]

[knobs]
l1_tiles             = { type = "triple", choices = [32] }
dual_buffer          = { type = "bool" }
l1_tiles_interchange = { type = "perm", choices = [[2, 0, 1]] }

[validation]
baseline_tag = "32x32x32_dbfalse"
